<!DOCTYPE html>
<html>

<head>
    <title>Lists and Table</title>
</head>

<body>

    <h2>Ordered List</h2>
    <ol>
        <li>Mathematics</li>
        <li>Physics</li>
        <li>Computer Science</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Reading</li>
        <li>Playing</li>
        <li>Music</li>
    </ul>

    <h2>Student Details</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>01</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Anita</td>
            <td>02</td>
            <td>78</td>
        </tr>
        <tr>
            <td>Ravi</td>
            <td>03</td>
            <td>90</td>
        </tr>
    </table>

</body>

</html>
